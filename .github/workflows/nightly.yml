name: Nightly Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/dependabot.yml'
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  metadata:
    name: Resolve nightly metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      tag: nightly
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          BASE=$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          DATE=$(date -u +%Y%m%d)
          VERSION="${BASE}-nightly.${DATE}.${SHORT_SHA}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

  macos:
    name: Build macOS DMG (arm64)
    needs: metadata
    runs-on: macos-14
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      TARGET: aarch64-apple-darwin
      ARCH: arm64
      BINARY_DIR: ${{ github.workspace }}/target/aarch64-apple-darwin/release
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-aarch64-apple-darwin

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/codex-plus-manager/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/codex-plus-manager
        run: npm ci

      - name: Build frontend assets
        working-directory: apps/codex-plus-manager
        run: npm run vite:build

      - name: Build release binaries
        run: cargo build --release --target aarch64-apple-darwin -p codex-plus-launcher -p codex-assistant

      - name: Make packager executable
        run: chmod +x scripts/installer/macos/package-dmg.sh

      - name: Package DMG
        run: bash scripts/installer/macos/package-dmg.sh "$VERSION" "$ARCH"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: dist/macos/CodexAssistant-${{ env.VERSION }}-macos-${{ env.ARCH }}.dmg
          if-no-files-found: error
          retention-days: 90

  windows:
    name: Build Windows installer (x64)
    needs: metadata
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Exclude build dirs from Defender
        shell: pwsh
        run: |
          $paths = @(
            "${env:GITHUB_WORKSPACE}\target",
            "${env:USERPROFILE}\.cargo",
            "${env:USERPROFILE}\.rustup"
          )
          foreach ($p in $paths) {
            try { Add-MpPreference -ExclusionPath $p -ErrorAction Stop } catch { Write-Host "skip $p ($($_.Exception.Message))" }
          }

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-x86_64-pc-windows-msvc

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/codex-plus-manager/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/codex-plus-manager
        run: npm ci

      - name: Build frontend assets
        working-directory: apps/codex-plus-manager
        run: npm run vite:build

      - name: Build release binaries
        run: cargo build --release --target x86_64-pc-windows-msvc -p codex-plus-launcher -p codex-assistant

      - name: Stage installer payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows/app | Out-Null
          Copy-Item -Force target/x86_64-pc-windows-msvc/release/codex-plus-plus.exe dist/windows/app/
          Copy-Item -Force target/x86_64-pc-windows-msvc/release/codex-plus-plus-manager.exe dist/windows/app/

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
          & $nsis "/DVERSION=$env:VERSION" scripts/installer/windows/CodexAssistant.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist/windows/CodexAssistant-${{ env.VERSION }}-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 90

  publish-nightly:
    name: Publish rolling nightly pre-release
    needs: [metadata, macos, windows]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.metadata.outputs.version }}
      SHORT_SHA: ${{ needs.metadata.outputs.short_sha }}
      TAG: ${{ needs.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: artifacts/macos

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts/windows

      - name: Refresh rolling nightly release
        run: |
          set -euxo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          NOTES=$(printf '自动构建的开发版（不保证稳定）\n\n- 提交：%s\n- 时间：%s\n- 工作流：%s\n' \
            "${{ github.sha }}" "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" "${{ github.run_id }}")
          gh release create "$TAG" \
            --title "Nightly $VERSION" \
            --notes "$NOTES" \
            --prerelease \
            --target "${{ github.sha }}"

      - name: Generate latest-nightly.json
        run: |
          REPO="${{ github.repository }}"
          BASE="https://github.com/$REPO/releases/download/$TAG"
          MAC_NAME=$(ls artifacts/macos)
          WIN_NAME=$(ls artifacts/windows)
          cat > latest-nightly.json <<EOF
          {
            "version": "$VERSION",
            "tag_name": "$TAG",
            "channel": "nightly",
            "url": "https://github.com/$REPO/releases/tag/$TAG",
            "assets": [
              { "name": "$WIN_NAME", "url": "$BASE/$WIN_NAME" },
              { "name": "$MAC_NAME", "url": "$BASE/$MAC_NAME" }
            ]
          }
          EOF

      - name: Upload assets to release
        run: |
          gh release upload "$TAG" \
            artifacts/macos/* \
            artifacts/windows/* \
            latest-nightly.json \
            --clobber
