name: Release Assets

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0) to attach assets to'
        required: true

permissions:
  contents: write

jobs:
  resolve-tag:
    name: Resolve release tag
    runs-on: macos-14
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - id: tag
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  ensure-release:
    name: Ensure GitHub release exists
    needs: resolve-tag
    runs-on: macos-14
    steps:
      - name: Create release if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes "Automated release for $TAG"
          fi

  macos:
    name: Build macOS DMG (arm64)
    needs: [resolve-tag, ensure-release]
    runs-on: macos-14
    env:
      VERSION: ${{ needs.resolve-tag.outputs.version }}
      TAG: ${{ needs.resolve-tag.outputs.tag }}
      TARGET: aarch64-apple-darwin
      ARCH: arm64
      BINARY_DIR: ${{ github.workspace }}/target/aarch64-apple-darwin/release
      HAS_MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-darwin
          rustup default stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/codex-assistant-manager/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/codex-assistant-manager
        run: npm ci

      - name: Build frontend assets
        working-directory: apps/codex-assistant-manager
        run: npm run vite:build

      - name: Build release binaries
        run: cargo build --release --target aarch64-apple-darwin -p codex-assistant-launcher -p codex-assistant

      - name: Import Developer ID certificate
        if: ${{ env.HAS_MACOS_CERTIFICATE == 'true' }}
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/codex-assistant-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          if ! printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH" 2>/dev/null; then
            printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$CERT_PATH"
          fi
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Package DMG
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_KEYCHAIN_PROFILE: ${{ secrets.MACOS_NOTARY_KEYCHAIN_PROFILE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/installer/macos/package-dmg.sh "$VERSION" "$ARCH"

      - name: Upload DMG to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DMG="dist/macos/CodexAssistant-${VERSION}-macos-${ARCH}.dmg"
          gh release upload "$TAG" "$DMG" --clobber

  windows:
    name: Build Windows installer (x64)
    needs: [resolve-tag, ensure-release]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.resolve-tag.outputs.version }}
      TAG: ${{ needs.resolve-tag.outputs.tag }}
      TARGET: x86_64-pc-windows-msvc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
          rustup default stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Disable Windows Defender on build dirs
        shell: pwsh
        run: |
          $paths = @(
            "${env:GITHUB_WORKSPACE}\target",
            "${env:USERPROFILE}\.cargo",
            "${env:USERPROFILE}\.rustup"
          )
          foreach ($p in $paths) {
            try { Add-MpPreference -ExclusionPath $p -ErrorAction Stop } catch { Write-Host "skip $p ($($_.Exception.Message))" }
          }

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/codex-assistant-manager/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/codex-assistant-manager
        run: npm ci

      - name: Build frontend assets
        working-directory: apps/codex-assistant-manager
        run: npm run vite:build

      - name: Build release binaries
        run: cargo build --release --target x86_64-pc-windows-msvc -p codex-assistant-launcher -p codex-assistant

      - name: Stage installer payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows/app | Out-Null
          Copy-Item -Force target/x86_64-pc-windows-msvc/release/codex-assistant.exe dist/windows/app/
          Copy-Item -Force target/x86_64-pc-windows-msvc/release/codex-assistant-manager.exe dist/windows/app/

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
          & $nsis "/DVERSION=$env:VERSION" scripts/installer/windows/CodexAssistant.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE" }

      - name: Upload installer to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $exe = "dist/windows/CodexAssistant-$env:VERSION-windows-x64-setup.exe"
          gh release upload $env:TAG $exe --clobber

  latest-json:
    name: Publish latest.json
    needs: [resolve-tag, macos, windows]
    if: ${{ needs.resolve-tag.result == 'success' && needs.macos.result == 'success' && needs.windows.result == 'success' }}
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify build artifacts are attached to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
          VERSION: ${{ needs.resolve-tag.outputs.version }}
        run: |
          assets=$(gh release view "$TAG" --json assets -q '[.assets[].name]')
          echo "Release assets: $assets"
          dmg="CodexAssistant-${VERSION}-macos-arm64.dmg"
          exe="CodexAssistant-${VERSION}-windows-x64-setup.exe"
          if ! echo "$assets" | grep -q "$dmg"; then
            echo "::error::macOS DMG ($dmg) missing from release — refusing to publish manifest"
            exit 1
          fi
          if ! echo "$assets" | grep -q "$exe"; then
            echo "::error::Windows installer ($exe) missing from release — refusing to publish manifest"
            exit 1
          fi

      - name: Generate latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve-tag.outputs.version }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          BASE="https://github.com/$REPO/releases/download/$TAG"
          mkdir -p release-assets
          gh release download "$TAG" \
            --pattern "CodexAssistant-${VERSION}-windows-x64-setup.exe" \
            --pattern "CodexAssistant-${VERSION}-macos-arm64.dmg" \
            --dir release-assets \
            --clobber
          WIN_SHA="$(shasum -a 256 "release-assets/CodexAssistant-${VERSION}-windows-x64-setup.exe" | awk '{print $1}')"
          MAC_SHA="$(shasum -a 256 "release-assets/CodexAssistant-${VERSION}-macos-arm64.dmg" | awk '{print $1}')"
          cat > latest.json <<EOF
          {
            "version": "$VERSION",
            "tag_name": "$TAG",
            "url": "https://github.com/$REPO/releases/tag/$TAG",
            "assets": [
              { "name": "CodexAssistant-${VERSION}-windows-x64-setup.exe", "url": "$BASE/CodexAssistant-${VERSION}-windows-x64-setup.exe", "sha256": "$WIN_SHA" },
              { "name": "CodexAssistant-${VERSION}-macos-arm64.dmg", "url": "$BASE/CodexAssistant-${VERSION}-macos-arm64.dmg", "sha256": "$MAC_SHA" }
            ]
          }
          EOF

      - name: Upload latest.json to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: gh release upload "$TAG" latest.json --clobber
