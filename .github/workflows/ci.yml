name: CI

# Budget-aware CI for the free GitHub Actions tier (2000 Linux-min/month on
# private repos; macOS = 10× Linux, Windows = 2× Linux).
#
# - Every push/PR runs Linux-only: fmt, clippy, test, frontend typecheck +
#   vitest + vite build. ~10 Linux-min/run.
# - macOS + Windows clippy/test run only on demand: workflow_dispatch, a PR
#   labelled `ci:full`, or a push to a tag (`v*`). ~150 Linux-min/run.
# - Installers are built by release-assets.yml on release publication.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/dependabot.yml'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/dependabot.yml'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      full_matrix:
        description: 'Run macOS + Windows jobs as well'
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-linux:
    name: Rust (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ''
          persist-credentials: false

      - name: Setup Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/codex-assistant-manager/package-lock.json

      - name: Build frontend (required by tauri::generate_context!)
        working-directory: apps/codex-assistant-manager
        run: |
          npm ci
          npm run vite:build

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --no-fail-fast

  rust-platform:
    name: Rust ${{ matrix.os }}
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.full_matrix
      || startsWith(github.ref, 'refs/tags/v')
      || contains(github.event.pull_request.labels.*.name, 'ci:full')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ''
          persist-credentials: false

      - name: Setup Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/codex-assistant-manager/package-lock.json

      - name: Build frontend (required by tauri::generate_context!)
        working-directory: apps/codex-assistant-manager
        run: |
          npm ci
          npm run vite:build

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --no-fail-fast

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/codex-assistant-manager
    steps:
      - uses: actions/checkout@v4
        with:
          token: ''
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/codex-assistant-manager/package-lock.json

      - name: npm ci
        run: npm ci

      - name: TypeScript check
        run: npm run check

      - name: Vitest
        run: npm run test

      - name: Vite build
        run: npm run vite:build
