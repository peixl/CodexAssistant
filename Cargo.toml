[workspace]
resolver = "2"
members = [
  "crates/codex-assistant-core",
  "crates/codex-assistant-data",
  "apps/codex-assistant-launcher",
  "apps/codex-assistant-manager/src-tauri",
]

[workspace.package]
version = "1.2.4"
edition = "2024"
license = "MIT"
authors = ["peixl <pxlosx@gmail.com>", "IFQ.AI"]
repository = "https://github.com/peixl/CodexAssistant"
homepage = "https://github.com/peixl/CodexAssistant"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
directories = "6"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "system-proxy"], default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
getrandom = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }
winresource = "0.1"
