[package]
name = "codex-assistant"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "codex_assistant_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "codex-assistant-manager"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait = "0.1"
codex-assistant-core = { path = "../../../crates/codex-assistant-core" }
codex-assistant-data = { path = "../../../crates/codex-assistant-data" }
directories.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-dialog = "2"
tokio = { workspace = true, features = ["time"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile.workspace = true
